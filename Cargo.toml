[package]
name = "skillenv"
version = "1.1.0"
edition = "2024"
description = "Manage repo-local and remote AI skills, then link them into agent skill directories."
license = "MIT"
repository = "https://github.com/igtm/skillenv"

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10"
tempfile = "3.20.0"
thiserror = "2.0.17"
toml_edit = { version = "0.25", features = ["serde"] }
walkdir = "2.5.0"

[dev-dependencies]
